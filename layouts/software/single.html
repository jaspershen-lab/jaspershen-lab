{{- define "main" -}}
<article class="article software-detail">
  <div class="article-container">
    <header class="software-detail__header">
      {{ with partial "functions/get_featured_image.html" . }}
        {{ $logo := .Fit "480x360 webp" }}
        <img class="software-detail__logo{{ if $.Params.image.dark_backdrop }} software-logo--dark-backdrop{{ end }}" src="{{ $logo.RelPermalink }}" width="{{ $logo.Width }}" height="{{ $logo.Height }}" alt="{{ $.Title }} logo">
      {{ end }}
      <div class="software-detail__intro">
        <h1>{{ .Title }}</h1>
        {{ with .Params.subtitle }}<p class="page-subtitle">{{ . | markdownify }}</p>{{ end }}
        {{ partial "page_links_div.html" . }}
      </div>
    </header>
    <div class="article-style">{{ .Content }}</div>
    {{ partial "page_footer" . }}
  </div>
</article>
{{- end -}}
